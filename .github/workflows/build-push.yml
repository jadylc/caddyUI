name: Build & Push

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. 1.0.3)"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${VERSION#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$'; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi
          echo "tag=$VERSION" >> $GITHUB_OUTPUT

          # 正式版本（不带预发布后缀）才推进 latest；
          # v1.2.0-unstable.N 这类预发布构建只推带版本号的 tag，
          # 避免把未验证的镜像推给使用 :latest 的部署。
          {
            echo "tags<<TAGS_EOF"
            echo "${DOCKERHUB_USERNAME}/caddy-ui:${VERSION}"
            if ! printf '%s' "$VERSION" | grep -q '-'; then
              echo "${DOCKERHUB_USERNAME}/caddy-ui:latest"
            fi
            echo "TAGS_EOF"
          } >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.version.outputs.tags }}
          build-args: |
            GOPROXY=https://proxy.golang.org|https://goproxy.cn|direct
            APP_VERSION=v${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
